name: Format wikilinks on PRs

on:
  pull_request:

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Format Markdown
        uses: ./.github/actions/format-wikilinks
        with:
          args: --changed ${{ github.event.pull_request.base.sha }} ${{ github.event.pull_request.head.sha }}

      - name: Commit formatting changes
        uses: ./.github/actions/commit-and-push
        with:
          paths: "*.md"
          message: "Normalize Markdown"
