name: Deploy site to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Determine formatter arguments
        id: format-args
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "args=--all" >> "$GITHUB_OUTPUT"
          else
            echo "args=--changed ${{ github.event.before }} ${{ github.sha }}" >> "$GITHUB_OUTPUT"
          fi
      - name: Format Markdown
        id: format
        uses: ./.github/actions/format-wikilinks
        with:
          args: ${{ steps.format-args.outputs.args }}
      - name: Commit formatting changes
        if: steps.format.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- '*.md'
          git commit -m "Normalize Markdown"
          git push
      - uses: docker/setup-buildx-action@v4
      - name: Build site
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          outputs: type=local,dest=./public
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: public

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
