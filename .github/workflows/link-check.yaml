name: Check wikilinks

on:
  pull_request:
    paths:
      - "**.md"

jobs:
  check-links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check Markdown formatting
        id: format
        uses: ./.github/actions/format-wikilinks
        with:
          args: --changed ${{ github.event.pull_request.base.sha }} ${{ github.sha }}

      - name: Report formatting issues
        if: steps.format.outputs.changed == 'true'
        run: |
          echo "::error::Wikilinks are not normalized. Run ./tools/format-wikilinks.sh --staged (or --all) locally and commit the result."
          git diff --name-only -- '*.md' | while IFS= read -r file; do
            echo "::error file=$file::This file needs wikilink formatting. Run tools/format-wikilinks.sh locally and commit the change."
          done
          git diff -- '*.md'
          exit 1
