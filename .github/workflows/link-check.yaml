name: Check wikilinks

on:
  pull_request:

permissions:
  contents: write

jobs:
  check-links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Format Markdown
        id: format
        uses: ./.github/actions/format-wikilinks
        with:
          args: --changed ${{ github.event.pull_request.base.sha }} ${{ github.event.pull_request.head.sha }}

      - name: Commit formatting changes
        if: steps.format.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- '*.md'
          git commit -m "Normalize Markdown"
          git push
