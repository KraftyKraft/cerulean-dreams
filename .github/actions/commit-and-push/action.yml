name: Commit and push
description: Stage the given paths and push a commit if anything changed

inputs:
  paths:
    description: Pathspec(s) to stage and check for changes, space-separated
    required: true
  message:
    description: Commit message to use
    required: true

outputs:
  committed:
    description: "true if a commit was created and pushed"
    value: ${{ steps.commit.outputs.committed }}

runs:
  using: composite
  steps:
    - name: Commit and push if changed
      id: commit
      shell: bash
      run: |
        if git diff --quiet -- ${{ inputs.paths }}; then
          echo "committed=false" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git add -- ${{ inputs.paths }}
        git commit -m "${{ inputs.message }}"
        git push
        echo "committed=true" >> "$GITHUB_OUTPUT"
